<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Logo Quiosque Cabana da Reserva">
  <defs>
    <linearGradient id="crBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2EEE6"/>
    </linearGradient>
  </defs>
  <!-- Outer badge -->
  <circle cx="120" cy="112" r="92" fill="url(#crBg)" stroke="#1E3F66" stroke-width="5"/>
  <circle cx="120" cy="112" r="83" fill="none" stroke="#1E3F66" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.45"/>

  <!-- Left: Coral Shrimp (Camarão) -->
  <g fill="#D84A52" stroke="#A62B32" stroke-width="1.2">
    <!-- Antennae -->
    <path d="M 108,58 Q 132,38 152,52" fill="none" stroke="#D84A52" stroke-width="2" stroke-linecap="round"/>
    <path d="M 105,63 Q 126,48 144,60" fill="none" stroke="#D84A52" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Body curve -->
    <path d="M 112,62 C 82,66 56,88 58,116 C 60,136 78,150 96,154 L 102,146 C 86,140 76,128 76,114 C 76,96 92,80 114,74 Z"/>
    <!-- Tail fan -->
    <path d="M 96,154 L 112,162 L 106,148 L 116,152 L 102,144 Z"/>
  </g>
  <!-- Shrimp segments (white lines) -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <line x1="92" y1="74" x2="98" y2="86"/>
    <line x1="76" y1="88" x2="86" y2="96"/>
    <line x1="66" y1="106" x2="79" y2="109"/>
    <line x1="68" y1="124" x2="81" y2="122"/>
    <line x1="78" y1="140" x2="88" y2="134"/>
  </g>

  <!-- Right: Atlantic Blue Fish (Peixe) -->
  <g fill="#2364AA" stroke="#164273" stroke-width="1.2">
    <path d="M 134,66 C 164,62 186,84 184,114 C 182,132 172,144 162,152 L 172,164 L 154,158 L 146,168 L 150,150 C 160,138 166,126 164,110 C 162,92 148,78 130,76 Z"/>
  </g>
  <circle cx="142" cy="72" r="2.2" fill="#FFFFFF"/>
  <g stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
    <line x1="156" y1="76" x2="150" y2="86"/>
    <line x1="168" y1="88" x2="158" y2="96"/>
    <line x1="175" y1="104" x2="164" y2="108"/>
  </g>

  <!-- Center Bottom: Nautical Anchor -->
  <g fill="none" stroke="#1E3F66" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="120" cy="108" r="7"/>
    <line x1="120" y1="115" x2="120" y2="164"/>
    <line x1="102" y1="126" x2="138" y2="126"/>
    <path d="M 94,148 C 98,164 110,168 120,168 C 130,168 142,164 146,148"/>
  </g>
  <polygon points="90,152 94,142 101,151" fill="#1E3F66"/>
  <polygon points="150,152 146,142 139,151" fill="#1E3F66"/>

  <!-- Bottom Ribbon: CABANA DA RESERVA -->
  <rect x="14" y="182" width="212" height="36" rx="8" fill="#1E3F66" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="120" y="205" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" letter-spacing="1.2">CABANA DA RESERVA</text>
</svg>
